<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Artigo — André Rodrigues</title>
  <link rel="stylesheet" href="style.css">
  <script src="components.js" defer></script>
  <style>
    /* ========================================== */
    /*        DESIGN EDITORIAL DE LUXO            */
    /* ========================================== */
    
    .editorial-container {
      max-width: 720px; /* Largura ideal para leitura prolongada */
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
    }

    .editorial-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .editorial-meta {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .editorial-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 25px;
      letter-spacing: -0.02em;
    }

    .editorial-cover {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 50px auto;
      display: block;
      height: 50vh;
      min-height: 400px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: none; /* Oculto até ser injetado via JS */
    }

    .editorial-body {
      font-size: 21px; /* Tamanho de letra de revista premium */
      line-height: 1.8;
      color: var(--text);
    }

    .editorial-body p {
      margin-bottom: 1.8em;
      color: rgba(255, 255, 255, 0.85); /* Contraste suavizado para leitura */
    }

    /* O toque académico/editorial: Letra Capital (Drop Cap) no 1º Parágrafo */
    .editorial-body > p:first-of-type::first-letter {
      font-size: 4em;
      font-weight: 800;
      color: var(--accent);
      float: left;
      line-height: 0.8;
      margin-right: 12px;
      margin-top: 6px;
    }

    /* Estilo para Citações/Blockquotes */
    .editorial-body blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 20px;
      margin: 40px 0;
      font-size: 24px;
      font-style: italic;
      color: var(--text);
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 1px solid var(--line);
    }

    .tag-badge {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      transition: 0.2s;
    }
    .tag-badge:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      .editorial-cover { height: 250px; border-radius: 12px; margin-bottom: 30px; }
      .editorial-body { font-size: 18px; }
      .editorial-body > p:first-of-type::first-letter { font-size: 3.2em; margin-top: 4px; }
    }
  </style>
</head>
<body>
<main style="padding-top: 80px;">

  <!-- O Cabeçalho Centrado -->
  <header class="editorial-header wrap">
    <a href="caderno.html" style="color: var(--muted); font-size: 14px; text-decoration: none; display: inline-block; margin-bottom: 30px; transition: 0.2s;">
      ← Voltar aos artigos
    </a>
    <div class="editorial-meta">
      <span id="artigoCategoria">—</span>
      <span style="color: var(--line);">•</span>
      <span id="artigoData" style="color: var(--muted);">—</span>
    </div>
    <h1 id="artigoTitulo" class="editorial-title">A carregar...</h1>
  </header>

  <!-- A Imagem de Capa Cinematográfica -->
  <div class="wrap">
    <img id="artigoImagem" class="editorial-cover" src="" alt="Capa">
  </div>

  <!-- Corpo do Texto e Tags -->
  <article class="editorial-container">
    <div id="artigoConteudo" class="editorial-body">
      <p style="text-align: center; color: var(--muted);">A ler o ficheiro...</p>
    </div>
    
    <div id="artigoTags" class="tag-container"></div>
  </article>

</main>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      document.getElementById('artigoTitulo').innerText = "Artigo não encontrado";
      return;
    }

    try {
      const response = await fetch(`content/caderno/${slug}.md`);
      if (!response.ok) throw new Error('Ficheiro não encontrado');
      
      const markdownText = await response.text();
      const partes = markdownText.split('---');
      let metadata = {};
      let conteudoMd = markdownText;

      if (partes.length >= 3) {
        const frontmatter = partes[1].trim();
        conteudoMd = partes.slice(2).join('---').trim();

        const getMeta = (key) => {
          const regex = new RegExp(`^${key}:\\s*(.*)$`, 'mi');
          const match = frontmatter.match(regex);
          return match ? match[1].trim().replace(/^["'](.+)(["'])$/, '$1') : '';
        };

        metadata.title = getMeta('title');
        metadata.categoria = getMeta('categoria');
        metadata.date = getMeta('date');
        metadata.image = getMeta('image');

        metadata.tags = [];
        let lendoTags = false;
        frontmatter.split('\n').forEach(linha => {
          const l = linha.trim();
          if (l.startsWith('tags:')) {
            lendoTags = true;
            const inlineMatch = l.match(/\[(.*?)\]/);
            if (inlineMatch) {
              metadata.tags = inlineMatch[1].split(',').map(t => t.trim().replace(/['"]/g, ''));
              lendoTags = false;
            }
          } else if (lendoTags && l.startsWith('-')) {
            metadata.tags.push(l.replace('-', '').trim().replace(/['"]/g, ''));
          } else if (lendoTags && l !== '' && !l.startsWith('-')) {
            lendoTags = false;
          }
        });
      }

      document.getElementById('pageTitle').innerText = `${metadata.title || 'Artigo'} — André Rodrigues`;
      document.getElementById('artigoTitulo').innerText = metadata.title || 'Sem Título';
      document.getElementById('artigoCategoria').innerText = metadata.categoria || 'Artigo';
      document.getElementById('artigoData').innerText = metadata.date || '';
      
      if (metadata.image) {
        const imgElement = document.getElementById('artigoImagem');
        imgElement.src = metadata.image;
        imgElement.style.display = 'block';
      }

      if (metadata.tags && metadata.tags.length > 0) {
        document.getElementById('artigoTags').innerHTML = metadata.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('');
      }

      const paragrafosHTML = conteudoMd.split('\n\n').map(p => {
        if (!p.trim()) return '';
        // Converte > em blockquotes reais para design
        if (p.trim().startsWith('>')) return `<blockquote>${p.replace('>', '').trim()}</blockquote>`;
        return `<p>${p}</p>`;
      }).join('');
      
      document.getElementById('artigoConteudo').innerHTML = paragrafosHTML;

    } catch (error) {
      document.getElementById('artigoTitulo').innerText = "Artigo Indisponível";
      document.getElementById('artigoConteudo').innerHTML = "<p style='text-align:center;'>O artigo encontra-se em modo rascunho ou não existe.</p>";
    }
  });
</script>

</body>
</html>
