<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controlo — Back Office</title>
  <link href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet" />
</head>
<body>

  <!-- 1. Configuração injetada globalmente ANTES do CMS carregar -->
  <script>
    window.CMS_MANUAL_INIT = true;
    window.CMS_CONFIG = {
      backend: {
       name: 'github',
          repo: 'andrejr20214-ai/portefolio-andre', // <-- Coloque o seu repositório real ex: andre/portefolio
          branch: 'main',
          auth_type: 'pkce',
          app_id: 'Ov23liEWNWWTAgoiGSYR' // <-- Coloque o seu App ID da OAuth App
      },
      media_folder: 'images',
      public_folder: '/images',
      collections: [
        {
          name: 'caderno',
          label: 'O Caderno (Artigos)',
          folder: 'content/caderno',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: 'Título do Artigo', name: 'title', widget: 'string' },
            { label: 'Data de Publicação', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false },
            { label: 'Imagem de Capa', name: 'image', widget: 'image', required: false },
            { label: 'Categoria Principal', name: 'categoria', widget: 'string', default: 'Reflexão' },
            { label: 'Tags / Palavras-chave', name: 'tags', widget: 'list', required: false },
            { label: 'Excerto / Resumo', name: 'resumo', widget: 'text', required: false },
            { label: 'Guardar como Rascunho?', name: 'draft', widget: 'boolean', default: false },
            { label: 'Conteúdo do Artigo', name: 'body', widget: 'markdown' }
          ]
        }
      ]
    };
  </script>

  <!-- 2. Carrega o script do CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 3. Inicializa o CMS com a nossa configuração manual -->
  <script>
    CMS.init({ config: window.CMS_CONFIG });
  </script>

</body>
</html>
