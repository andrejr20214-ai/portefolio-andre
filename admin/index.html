<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controlo — Back Office</title>
  <link href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet" />
</head>
<body>

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    CMS.init({
      config: {
        // 1. LIGAÇÃO DIRETA AO GITHUB (Via PKCE)
        backend: {
          name: 'github',
          repo: 'andrejr20214-ai/portefolio-andre', // Ex: andrerodrigues/portefolio
          branch: 'main',
          auth_type: 'pkce',
          app_id: 'Ov23liEWNWWTAgoiGSYR'
        },
        
        // 2. PASTAS DE IMAGENS
        media_folder: 'images',
        public_folder: '/images',
        
        // 3. ESTRUTURA DOS ARTIGOS (Modo Editorial)
        collections: [
          {
            name: 'caderno',
            label: 'O Caderno (Artigos)',
            folder: 'content/caderno',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Título do Artigo', name: 'title', widget: 'string' },
              { label: 'Data de Publicação', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false },
              { label: 'Imagem de Capa', name: 'image', widget: 'image', required: false, hint: 'A imagem panorâmica que aparece no topo.' },
              { label: 'Categoria Principal', name: 'categoria', widget: 'string', default: 'Reflexão' },
              { label: 'Tags / Palavras-chave', name: 'tags', widget: 'list', required: false, hint: 'Pressione Enter após cada tag.' },
              { label: 'Excerto / Resumo', name: 'resumo', widget: 'text', required: false },
              { label: 'Guardar como Rascunho?', name: 'draft', widget: 'boolean', default: false, hint: 'Oculte o artigo até estar finalizado.' },
              { label: 'Conteúdo do Artigo', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
